name: authorized_redteam
description: Enterprise red-team safe coverage. Adds internal network, AD, IoT/CCTV, wireless/physical/SOC, firmware, AI, and residual-risk registers. Requires written SoW.
active_probes: true
send_payloads: true
rate_limit:
  global_rps: 8
  per_target_rps: 4
  per_endpoint_rps: 1
payload_classes:
- time_blind
- oob
- reflection
- differential
nuclei:
